name: PRISM27 free macOS Xcode runner probe
on:
  push:
    branches:
      - prism27-runner-diagnostic
permissions:
  contents: read
jobs:
  xcode:
    runs-on: xcode-27
    timeout-minutes: 2
    steps:
      - name: Verify Xcode availability
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
